<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMALAB 今日の予想</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8F%87</text></svg>">
<meta name="description" content="UMALAB（馬ラボ）が本日・翌日に解析した地方競馬の候補レースを、発走前に記録したデータとしてそのまま公開しています。実購入は推奨していません。">
<!-- アクセス解析（無料、GoatCounter） -->
<script data-goatcounter="https://umalab-checker.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0b0f0c; --bg-elev:#141a15; --bg-elev2:#1b231c; --border:#293129;
  --text:#edf1ea; --text-dim:#9fab98; --text-faint:#6d7869;
  --accent:#58d97a; --accent-dim:#2f6b43; --accent-bg:#132317;
  --warn:#ecc24b; --warn-bg:#2a2210;
  --bad:#ef6b61; --bad-bg:#2a1512;
  --info:#6fb0ef; --info-bg:#122234;
  --chip:#1d251e;
  --radius:16px; --radius-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{margin:0;background:var(--bg);color:var(--text);}
body{
  font-family:"Noto Sans JP","Hiragino Sans",sans-serif;
  line-height:1.6; font-size:16px; -webkit-font-smoothing:antialiased;
  overflow-x:hidden; width:100%;
}
.num{font-family:"Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums;}
a{color:var(--accent);text-decoration:none;}
h1,h2,h3{font-family:"Zen Kaku Gothic New",sans-serif;margin:0;}
button{font-family:inherit;}

/* ---------- layout shell ---------- */
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(11,15,12,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  padding:14px 16px 10px;border-bottom:1px solid var(--border);
}
.topbar-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.brand{font-weight:900;font-size:17px;letter-spacing:.02em;color:var(--accent);}
.date-pill{font-size:12.5px;color:var(--text-dim);font-weight:700;}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px;}
.stat-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;}
.stat-card .label{font-size:11px;color:var(--text-dim);margin-bottom:2px;}
.stat-card .value{font-size:19px;font-weight:900;color:var(--text);}
.stat-card .value.accent{color:var(--accent);}
.stat-card .sub{font-size:10.5px;color:var(--text-faint);margin-top:2px;}

.main{flex:1;padding:14px 14px calc(84px + var(--safe-b));width:100%;}
.view{display:none;}
.view.active{display:block;}

/* ---------- generic components ---------- */
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.banner{border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:12px;line-height:1.55;}
.banner.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);}
.banner.info{background:var(--info-bg);color:var(--info);border:1px solid var(--info);}
.banner.neutral{background:var(--chip);color:var(--text-dim);border:1px solid var(--border);font-weight:500;}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.chip.ok{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-dim);}
.chip.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #6b5a1e;}
.chip.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #6b2b26;}
.chip.muted{background:var(--chip);color:var(--text-dim);border:1px solid var(--border);}

.section-title{font-size:11px;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;}

/* waku(frame) chip: color + always a number, never color-only */
.waku{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:13px;font-weight:900;flex-shrink:0;border:1px solid rgba(0,0,0,.25);}
.waku-1{background:#fff;color:#111;}
.waku-2{background:#1a1a1a;color:#fff;}
.waku-3{background:#d1372b;color:#fff;}
.waku-4{background:#1c5fc9;color:#fff;}
.waku-5{background:#e8c520;color:#222;}
.waku-6{background:#2a9e4e;color:#fff;}
.waku-7{background:#e8792a;color:#fff;}
.waku-8{background:#e87fae;color:#222;}
.waku-unknown{background:var(--chip);color:var(--text-faint);border-style:dashed;}

/* ---------- track accordion (今日/明日) ---------- */
.track-group{margin-bottom:10px;}
.track-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 14px;min-height:52px;cursor:pointer;
}
.track-head .name{font-weight:900;font-size:16px;}
.track-head .meta{font-size:12px;color:var(--text-dim);}
.track-head .arrow{font-size:14px;color:var(--text-faint);transition:transform .15s;}
.track-head[aria-expanded="true"] .arrow{transform:rotate(90deg);}
.track-races{display:none;padding-top:8px;}
.track-races.open{display:block;}

.race-card{background:var(--bg-elev2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;}
.race-top{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;min-height:44px;}
.race-top .rno{font-weight:900;font-size:14.5px;}
.race-top .ptime{font-size:12.5px;color:var(--text-dim);font-weight:700;}
.race-badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.race-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.race-detail.open{display:block;}

.horse-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.horse-row:last-child{border-bottom:none;}
.horse-mark{width:20px;text-align:center;font-weight:900;color:var(--accent);flex-shrink:0;}
.horse-main{flex:1;min-width:0;}
.horse-name{font-weight:700;font-size:14px;}
.horse-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px;display:flex;gap:10px;flex-wrap:wrap;}
.horse-metric{text-align:right;flex-shrink:0;}
.horse-metric .big{font-weight:900;font-size:15px;}
.horse-metric .cap{font-size:10px;color:var(--text-faint);}

.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px;margin-top:8px;}
.kv-grid .k{color:var(--text-dim);}
.kv-grid .v{font-weight:700;text-align:right;}

.reason-box{font-size:12px;color:var(--text-dim);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.reason-box strong{color:var(--text);}

.rec-box{border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px;font-size:12.5px;}
.rec-box.yes{background:var(--accent-bg);border:1px solid var(--accent-dim);}
.rec-box.no{background:var(--chip);border:1px solid var(--border);color:var(--text-dim);}
.rec-box .title{font-weight:900;font-size:13px;margin-bottom:4px;}
.rec-box.yes .title{color:var(--accent);}

.loading{text-align:center;color:var(--text-dim);padding:48px 0;font-size:13px;}

/* ---------- filters (全レース結果) ---------- */
.filter-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.filter-bar label{display:block;font-size:10.5px;color:var(--text-faint);margin-bottom:3px;font-weight:700;}
.filter-bar select{
  width:100%;min-height:44px;padding:8px 10px;border-radius:var(--radius-sm);
  background:var(--bg-elev);border:1px solid var(--border);color:var(--text);font-size:13px;
}
.period-toggle{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.period-toggle button{
  flex-shrink:0;background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);
  font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:999px;min-height:36px;
}
.period-toggle button.active{background:var(--accent-bg);border-color:var(--accent-dim);color:var(--accent);}
.bettype-mini{font-size:11px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.bettype-mini span{white-space:nowrap;}
.bettype-mini b{color:var(--text);}

/* ---------- 全レース結果: 比較カード(2026-11-14 UI改善) ---------- */
.date-picker-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.date-picker-row input[type="date"]{
  flex:1;min-height:40px;padding:6px 10px;border-radius:var(--radius-sm);
  background:var(--bg-elev);border:1px solid var(--border);color:var(--text);font-size:13.5px;
}
.date-picker-row button{
  min-height:40px;padding:0 14px;border-radius:var(--radius-sm);
  background:var(--accent-bg);border:1px solid var(--accent-dim);color:var(--accent);
  font-weight:700;font-size:13px;white-space:nowrap;
}
.chip-filter-row{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  margin-bottom:8px;padding-bottom:2px;}
.chip-filter-row button{
  flex-shrink:0;background:var(--bg-elev);border:1px solid var(--border);color:var(--text-dim);
  font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;min-height:34px;white-space:nowrap;
}
.chip-filter-row button.active{background:var(--accent-bg);border-color:var(--accent-dim);color:var(--accent);}
.sort-toggle-row{display:flex;justify-content:flex-end;margin-bottom:10px;}
.sort-toggle-row button{
  background:none;border:1px solid var(--border);color:var(--text-dim);font-size:11.5px;
  padding:5px 10px;border-radius:999px;min-height:30px;
}
.sort-toggle-row button.active{color:var(--accent);border-color:var(--accent-dim);}

.summary-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;}
.summary-card .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.summary-card .cell{background:var(--bg-elev2);border-radius:var(--radius-sm);padding:8px 10px;}
.summary-card .cell .label{font-size:10.5px;color:var(--text-faint);}
.summary-card .cell .value{font-size:16px;font-weight:900;margin-top:2px;}
.summary-card .cell .value.accent{color:var(--accent);}
.summary-card .cell .value.bad{color:var(--bad);}
.summary-card .note{font-size:10.5px;color:var(--text-faint);margin-top:8px;}

.compare-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
  padding:0;margin-bottom:10px;overflow:hidden;}
.compare-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:12px 14px;cursor:pointer;min-height:48px;}
.compare-head .meta{display:flex;flex-direction:column;gap:1px;}
.compare-head .track-race{font-weight:900;font-size:14.5px;}
.compare-head .ptime{font-size:11.5px;color:var(--text-dim);}
.status-badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;flex-shrink:0;}
.status-badge.upcoming{background:var(--info-bg);color:var(--info);}
.status-badge.pending{background:var(--chip);color:var(--text-dim);}
.status-badge.finished{background:var(--accent-bg);color:var(--accent);}
.compare-body{display:none;padding:0 14px 14px;}
.compare-body.open{display:block;}
.compare-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.compare-col{background:var(--bg-elev2);border-radius:var(--radius-sm);padding:10px;min-width:0;}
.compare-col .col-title{font-size:10.5px;color:var(--text-faint);font-weight:700;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.04em;}
.pick-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12.5px;}
.pick-row .rank{font-size:10px;color:var(--text-faint);width:14px;flex-shrink:0;}
.pick-no{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;
  padding:0 4px;border-radius:6px;background:var(--chip);font-weight:900;font-size:12.5px;flex-shrink:0;}
.pick-no.match{background:var(--accent);color:#0b0f0c;}
.pick-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;}
.pick-row.empty{color:var(--text-faint);font-size:11.5px;}

.hit-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px;}
.hit-chip{display:flex;align-items:center;justify-content:space-between;gap:6px;
  background:var(--bg-elev2);border-radius:var(--radius-sm);padding:7px 10px;font-size:12px;}
.hit-chip .hit-label{color:var(--text-dim);}
.hit-chip .hit-result{font-weight:900;display:flex;align-items:center;gap:3px;}
.hit-chip .hit-result.hit{color:var(--accent);}
.hit-chip .hit-result.miss{color:var(--bad);}
.hit-chip .hit-result.pending{color:var(--text-faint);}

.pnl-box{background:var(--bg-elev2);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;}
.pnl-box .kv-grid{margin-top:0;}
.pnl-box .title{font-size:11.5px;font-weight:900;margin-bottom:6px;color:var(--text-dim);}
.model-tag{font-size:10px;color:var(--text-faint);margin-top:8px;}

.result-row{background:var(--bg-elev2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
.result-row .head{display:flex;justify-content:space-between;font-weight:900;margin-bottom:4px;}
.result-row .legs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.legtag{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:999px;}
.legtag.hit{background:var(--accent-bg);color:var(--accent);}
.legtag.miss{background:var(--chip);color:var(--text-dim);}
.legtag.pending{background:var(--warn-bg);color:var(--warn);}
.legtag.muted{background:var(--chip);color:var(--text-faint);}

/* ---------- condition rows / pnl table ---------- */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap;}
table.data th,table.data td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);}
table.data th:first-child,table.data td:first-child{text-align:left;white-space:normal;}
table.data th{color:var(--text-dim);font-weight:700;font-size:11px;}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(11,15,12,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + var(--safe-b));
  max-width:520px;margin:0 auto;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;color:var(--text-faint);padding:7px 1px;border-radius:12px;
  min-height:52px;min-width:0;
}
.nav-btn .ic{font-size:18px;line-height:1;}
.nav-btn .lb{font-size:9.5px;font-weight:700;white-space:nowrap;}
.nav-btn.active{color:var(--accent);}
.nav-btn.active .ic{filter:drop-shadow(0 0 6px rgba(88,217,122,.5));}

footer.disclaimer{font-size:11px;color:var(--text-faint);text-align:center;padding:10px 4px 0;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">🏇 UMALAB</div>
      <div class="date-pill" id="topDate">読み込み中…</div>
    </div>
    <div class="summary-grid" id="summaryGrid">
      <div class="stat-card"><div class="label">開催場数</div><div class="value num" id="statTracks">—</div></div>
      <div class="stat-card"><div class="label">解析レース数</div><div class="value num" id="statRaces">—</div></div>
      <div class="stat-card"><div class="label">購入推奨件数</div><div class="value num accent" id="statRecs">—</div></div>
      <div class="stat-card"><div class="label">仮想累積回収率</div><div class="value num" id="statRoi">—</div></div>
    </div>
  </div>

  <main class="main">

    <!-- ============ 今日の予想 ============ -->
    <section class="view active" id="view-today">
      <div id="todayBanners"></div>
      <div id="todayContent"><div class="loading">読み込み中…</div></div>
    </section>

    <!-- ============ 明日の予想 ============ -->
    <section class="view" id="view-tomorrow">
      <div id="tomorrowContent"><div class="loading">タブを開くと読み込みます…</div></div>
    </section>

    <!-- ============ 全レース結果 ============ -->
    <section class="view" id="view-results">
      <div id="resultsSummary"></div>
      <div id="resultsFilters"></div>
      <div id="resultsContent"><div class="loading">タブを開くと読み込みます…</div></div>
    </section>

    <!-- ============ 競馬場別成績 ============ -->
    <section class="view" id="view-tracks">
      <div id="tracksContent"><div class="loading">タブを開くと読み込みます…</div></div>
    </section>

    <!-- ============ 収支・回収率 ============ -->
    <section class="view" id="view-pnl">
      <div id="pnlContent"><div class="loading">タブを開くと読み込みます…</div></div>
    </section>

    <!-- ============ 研究結果 ============ -->
    <section class="view" id="view-research">
      <div id="researchContent"><div class="loading">タブを開くと読み込みます…</div></div>
    </section>

    <footer class="disclaimer">
      UMALAB｜検証段階の内容を正直に公開しています。予想モデルの利益性能は未検証です。<br>
      実際の購入判断はご自身の責任で行ってください。回収率100%超えを保証するものではありません。
    </footer>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-view="today"><span class="ic">📅</span><span class="lb">今日</span></button>
    <button class="nav-btn" data-view="tomorrow"><span class="ic">🌙</span><span class="lb">明日</span></button>
    <button class="nav-btn" data-view="results"><span class="ic">📋</span><span class="lb">全レース</span></button>
    <button class="nav-btn" data-view="tracks"><span class="ic">🏟️</span><span class="lb">競馬場別</span></button>
    <button class="nav-btn" data-view="pnl"><span class="ic">💰</span><span class="lb">仮想収支</span></button>
    <button class="nav-btn" data-view="research"><span class="ic">🔬</span><span class="lb">研究結果</span></button>
  </nav>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  };
  var pct = function(p){ return (p == null) ? null : Math.round(p * 1000) / 10; };
  var fmtPct = function(p){ var v = pct(p); return v == null ? "未取得" : v + "%"; };
  var fmtOdds = function(o){ return (o == null) ? "未取得" : (Math.round(o*10)/10) + "倍"; };
  var fmtEv = function(ev){ return (ev == null) ? "未取得" : (ev >= 0 ? "+" : "") + Math.round(ev*100) + "%"; };
  var fmtHHMM = function(raw){
    if(raw == null || raw === "") return "未取得";
    var digits = String(raw).replace(/\D/g, "").padStart(4, "0");
    return digits.slice(0, 2) + ":" + digits.slice(2, 4);
  };

  function todayStr(){
    var d = new Date();
    return "" + d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  }
  function fmtDateLabel(yyyymmdd){
    if(!yyyymmdd) return "日付未取得";
    var s = String(yyyymmdd);
    return s.slice(0,4) + "年" + s.slice(4,6) + "月" + s.slice(6,8) + "日";
  }

  function wakuChip(waku){
    if(waku == null) return '<span class="waku waku-unknown">?</span>';
    var n = ((waku - 1) % 8) + 1;
    return '<span class="waku waku-' + n + '">' + esc(waku) + '</span>';
  }

  /* ============================================================
     今日の予想
     ============================================================ */
  var TODAY_DATA = null;

  function horseEv(prob, odds){
    if(prob == null || odds == null) return null;
    return prob * odds - 1;
  }

  function renderRaceDetail(r){
    var marks = ["◎", "○", "▲"];
    var rows = (r.top3 || []).map(function(h, i){
      var ev = horseEv(h.prob, h.win_odds_at_prediction);
      return (
        '<div class="horse-row">' +
          '<div class="horse-mark">' + marks[i] + '</div>' +
          wakuChip(h.waku) +
          '<div class="horse-main">' +
            '<div class="horse-name">' + esc(h.no) + '番 ' + esc(h.name) + '</div>' +
            '<div class="horse-sub">' +
              '<span>予測確率(複勝圏内) ' + fmtPct(h.prob) + '</span>' +
              '<span>発走前オッズ ' + fmtOdds(h.win_odds_at_prediction) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="horse-metric"><div class="big">' + fmtEv(ev) + '</div><div class="cap">参考EV</div></div>' +
        '</div>'
      );
    }).join("") || '<div class="horse-row">データ未取得</div>';

    var vr = r.validated_recommendation || {};
    var recBox;
    if(vr.qualifies){
      recBox = '<div class="rec-box yes"><div class="title">✅ 購入推奨（既存ベストフィルター該当）</div>' +
        '複勝: ' + esc(vr.horse_no) + '番 ' + esc(vr.horse_name) +
        '（予測時点単勝オッズ ' + fmtOdds(vr.win_odds_at_prediction) + '）<br>' +
        '<span style="color:var(--text-dim);font-size:11.5px;">' + esc(vr.backtest_reference || "") + '</span></div>';
    } else {
      recBox = '<div class="rec-box no"><div class="title">購入推奨なし</div>' + esc(vr.reason || "条件不成立") + '</div>';
    }

    var wideNote = '<div class="reason-box"><strong>参考: ワイド方式（検証中・実購入非推奨）</strong><br>' +
      '判定: ' + esc(r.decision || "—") + '<br>' + esc(r.reason || "");
    if(r.wide_candidate && r.wide_candidate.combo){
      wideNote += '<br>買い目候補: ワイド ' + esc(r.wide_candidate.combo);
    }
    wideNote += '</div>';

    return (
      '<div class="kv-grid">' +
        '<div class="k">発走時刻</div><div class="v">' + esc(r.post_time) + '</div>' +
        '<div class="k">頭数</div><div class="v">' + (r.頭数 != null ? esc(r.頭数) + "頭" : "未取得") + '</div>' +
      '</div>' +
      '<div class="section-title">予測上位3頭</div>' + rows +
      recBox + wideNote +
      '<div class="reason-box">結果・的中判定は、レース終了後の夜間自動集計を経て「収支・回収率」タブに反映されます（終了直後のこの画面には表示されません）。</div>'
    );
  }

  function renderRaceCard(r){
    var vr = r.validated_recommendation || {};
    var el = document.createElement("div");
    el.className = "race-card";
    var badges = vr.qualifies
      ? '<span class="chip ok">✅ 購入推奨あり</span>'
      : '<span class="chip muted">見送り</span>';
    if(r.top3 && r.top3[0]){
      badges += '<span class="chip warn">本命 ' + esc(r.top3[0].no) + '番</span>';
    }
    el.innerHTML =
      '<div class="race-top">' +
        '<span class="rno">' + esc(r.race_no) + 'R</span>' +
        '<span class="ptime">' + esc(r.post_time) + ' 発走</span>' +
      '</div>' +
      '<div class="race-badges">' + badges + '</div>' +
      '<div class="race-detail">' + renderRaceDetail(r) + '</div>';
    el.querySelector(".race-top").addEventListener("click", function(){
      el.querySelector(".race-detail").classList.toggle("open");
    });
    return el;
  }

  function groupByTrack(races){
    var order = [], map = {};
    (races || []).forEach(function(r){
      if(!map[r.track]){ map[r.track] = []; order.push(r.track); }
      map[r.track].push(r);
    });
    return order.map(function(t){ return { track: t, races: map[t] }; });
  }

  function renderTrackGroups(groups, emptyMsg){
    var wrap = document.createElement("div");
    if(!groups.length){
      var b = document.createElement("div");
      b.className = "banner neutral";
      b.textContent = emptyMsg;
      wrap.appendChild(b);
      return wrap;
    }
    groups.forEach(function(g){
      var recCount = g.races.filter(function(r){ return r.validated_recommendation && r.validated_recommendation.qualifies; }).length;
      var box = document.createElement("div");
      box.className = "track-group";
      var head = document.createElement("div");
      head.className = "track-head";
      head.setAttribute("aria-expanded", "false");
      head.innerHTML =
        '<div><div class="name">' + esc(g.track) + '</div>' +
          '<div class="meta">' + g.races.length + 'レース' + (recCount ? ' ・ 推奨' + recCount + '件' : '') + '</div></div>' +
        '<div class="arrow">▶</div>';
      var body = document.createElement("div");
      body.className = "track-races";
      g.races.forEach(function(r){ body.appendChild(renderRaceCard(r)); });
      head.addEventListener("click", function(){
        var open = body.classList.toggle("open");
        head.setAttribute("aria-expanded", open ? "true" : "false");
      });
      box.appendChild(head);
      box.appendChild(body);
      wrap.appendChild(box);
    });
    return wrap;
  }

  function updateSummary(data){
    $("topDate").textContent = fmtDateLabel(data.date);
    var tracks = {};
    (data.races || []).forEach(function(r){ tracks[r.track] = true; });
    $("statTracks").textContent = Object.keys(tracks).length;
    $("statRaces").textContent = data.total_races_analyzed != null ? data.total_races_analyzed : "—";
    var recs = (data.races || []).filter(function(r){ return r.validated_recommendation && r.validated_recommendation.qualifies; }).length;
    $("statRecs").textContent = recs;
  }

  function renderToday(data){
    TODAY_DATA = data;
    var banners = $("todayBanners");
    banners.innerHTML = "";

    if(!data.date || data.date !== todayStr()){
      var b = document.createElement("div");
      b.className = "banner bad";
      b.textContent = "この解析は本日(" + fmtDateLabel(todayStr()) + ")更新分ではないため、予想として表示しません(データ日付: " + fmtDateLabel(data.date) + ")。過去の予想を本日分として表示することはありません。";
      banners.appendChild(b);
      $("todayContent").innerHTML = "";
      updateSummary({date: data.date, races: []});
      return;
    }

    updateSummary(data);

    if(data.odds_stale){
      var ob = document.createElement("div");
      ob.className = "banner warn";
      ob.textContent = "発走前オッズが約" + data.odds_age_minutes + "分前から更新できていません。購入前に必ずご自身でオッズをご確認ください。";
      banners.appendChild(ob);
    }

    var recCount = (data.races || []).filter(function(r){ return r.validated_recommendation && r.validated_recommendation.qualifies; }).length;
    if(recCount === 0 && (data.races || []).length > 0){
      var rb = document.createElement("div");
      rb.className = "banner info";
      rb.textContent = "本日解析した" + data.races.length + "レース中、既存ベストフィルター(複勝・予測1位・単勝オッズ1.0〜1.5倍)に該当する馬はまだありません。該当馬が出た時点でこの画面に表示されます。";
      banners.appendChild(rb);
    }

    if(data.total_races_unpredictable){
      var ub = document.createElement("div");
      ub.className = "banner neutral";
      ub.textContent = "本日の開催" + (data.total_races_scheduled != null ? data.total_races_scheduled : "?") + "レース中、" + data.total_races_unpredictable + "レースは発走前オッズ等のデータが未公開のため、まだ予想不能です(見送り判断とは別、データ待ちの状態)。";
      banners.appendChild(ub);
    }

    var content = $("todayContent");
    content.innerHTML = "";
    if(!data.races || data.races.length === 0){
      content.appendChild(renderTrackGroups([], "本日、解析対象のレースがまだありません。または本日の開催が終了しました。"));
      return;
    }
    content.appendChild(renderTrackGroups(groupByTrack(data.races), ""));
  }

  function loadToday(){
    fetch("today_picks_v2.json?t=" + Date.now(), {cache: "no-store"})
      .then(function(res){ return res.json(); })
      .then(renderToday)
      .catch(function(){
        $("todayContent").innerHTML = '<div class="banner bad">データの読み込みに失敗しました。</div>';

  /* ============================================================
     全レース結果(race_results_detail.json、戦略A-F精算済み2,384レース)
     ============================================================ */
  var RESULTS_DATA = null;
  var STRATEGY_LABELS = {
    A: "A: 単勝◎", B: "B: 複勝◎", C: "C: ワイド◎○", D: "D: ワイド◎▲",
    E: "E: ワイドBOX", F: "F: 既存ベストフィルター(複勝)",
  };
  var RESULTS_FILTER = { track: "", date: "", strategy: "A" };
  var RESULTS_PAGE_SIZE = 100;

  function legState(r, strat){
    var settled = r[strat + "_settled"];
    var hit = r[strat + "_hit"];
    var notPurchased = r[strat + "_not_purchased"];
    if(notPurchased) return { label: "対象外", cls: "miss" };
    if(settled) return { label: hit ? "的中" : "はずれ", cls: hit ? "hit" : "miss" };
    // settled=false/null: レース自体が中止・未確定か、軸馬等が個別に出走取消かを区別する
    if(r.race_status === "cancelled_or_pending" && !r.actual_top3){
      return { label: "中止/未定", cls: "pending" };
    }
    return { label: "返還", cls: "pending" };
  }

  function legTagHtml(state){
    return '<span class="legtag ' + state.cls + '">' + esc(state.label) + '</span>';
  }

  function renderResultRow(r, strat){
    var state = legState(r, strat);
    var payout = r[strat + "_payout"];
    var top3 = r.actual_top3;
    var top3Text = "未確定(中止の可能性を含む)";
    if(top3){
      var parts = ["1","2","3"].filter(function(k){ return top3[k]; })
        .map(function(k){ return k + "着:" + top3[k].no + "番" + top3[k].name; });
      top3Text = parts.join(" / ") || top3Text;
    }
    var el = document.createElement("div");
    el.className = "result-row";
    el.innerHTML =
      '<div class="head"><span>' + esc(r.track) + ' ' + esc(r.date) + ' ' + esc(r.race_no) + 'R</span>' +
        '<span>' + legTagHtml(state) + '</span></div>' +
      '<div style="color:var(--text-dim);">予想: ◎' + esc(r.axis_no) + '番' + esc(r.axis_name) +
      (r.sub1_no ? ' / ○' + esc(r.sub1_no) + '番' + esc(r.sub1_name) : '') +
      (r.sub2_no ? ' / ▲' + esc(r.sub2_no) + '番' + esc(r.sub2_name) : '') +
      '</div>' +
      '<div style="color:var(--text-dim);margin-top:2px;">確定: ' + esc(top3Text) + '</div>' +
      (state.cls !== "pending" && payout != null ? '<div class="legs">' + legTagHtml(state) +
        '<span class="legtag muted">払戻 ' + Math.round(payout) + '円/100円</span></div>' : '');
    return el;
  }

  function applyResultsFilters(){
    var rows = (RESULTS_DATA || {}).rows || [];
    var f = RESULTS_FILTER;
    return rows.filter(function(r){
      if(f.track && r.track !== f.track) return false;
      if(f.date && r.date !== f.date) return false;
      return true;
    });
  }

  function renderResultsList(){
    var container = $("resultsContent");
    var filtered = applyResultsFilters().slice().reverse(); // 新しい日付を先頭に
    var shown = filtered.slice(0, RESULTS_PAGE_SIZE);
    container.innerHTML = "";
    var summary = document.createElement("div");
    summary.className = "banner neutral";
    summary.textContent = "該当" + filtered.length + "件中" + shown.length + "件を表示(" + STRATEGY_LABELS[RESULTS_FILTER.strategy] + ")。";
    container.appendChild(summary);
    if(shown.length === 0){
      var e = document.createElement("div");
      e.className = "banner neutral";
      e.textContent = "条件に一致するレースがありません。";
      container.appendChild(e);
      return;
    }
    shown.forEach(function(r){ container.appendChild(renderResultRow(r, RESULTS_FILTER.strategy)); });
  }

  function renderResultsFilters(){
    var rows = (RESULTS_DATA || {}).rows || [];
    var tracks = Array.from(new Set(rows.map(function(r){ return r.track; }))).sort();
    var dates = Array.from(new Set(rows.map(function(r){ return r.date; }))).sort().reverse();
    var bar = $("resultsFilters");
    bar.innerHTML =
      '<div class="filter-bar">' +
        '<div><label>競馬場</label><select id="filterTrack"><option value="">すべて</option>' +
          tracks.map(function(t){ return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join("") +
        '</select></div>' +
        '<div><label>日付</label><select id="filterDate"><option value="">すべて</option>' +
          dates.map(function(d){ return '<option value="' + esc(d) + '">' + esc(fmtDateLabel(d)) + '</option>'; }).join("") +
        '</select></div>' +
        '<div style="grid-column:1/-1;"><label>券種・戦略</label><select id="filterStrategy">' +
          Object.keys(STRATEGY_LABELS).map(function(k){ return '<option value="' + k + '">' + esc(STRATEGY_LABELS[k]) + '</option>'; }).join("") +
        '</select></div>' +
      '</div>';
    $("filterTrack").addEventListener("change", function(e){ RESULTS_FILTER.track = e.target.value; renderResultsList(); });
    $("filterDate").addEventListener("change", function(e){ RESULTS_FILTER.date = e.target.value; renderResultsList(); });
    $("filterStrategy").addEventListener("change", function(e){ RESULTS_FILTER.strategy = e.target.value; renderResultsList(); });
  }

  function renderResults(){
    var content = $("resultsContent");
    content.innerHTML = '<div class="loading">読み込み中…(約2,400レース)</div>';
    fetch("race_results_detail.json?t=" + Date.now(), {cache: "no-store"})
      .then(function(res){ return res.json(); })
      .then(function(data){
        RESULTS_DATA = data;
        var note = document.createElement("div");
        note.className = "banner info";
        note.textContent = "既存の本番予測ログ(56日分・" + data.n_races + "レース)を使い、戦略A-Fを仮想購入した場合の精算結果です。実際の馬券購入ではありません。全レース予想とAI購入推奨(既存ベストフィルターF)は別物として区別しています。";
        $("resultsFilters").innerHTML = "";
        $("resultsFilters").appendChild(note);
        renderResultsFilters();
        renderResultsList();
      })
      .catch(function(){
        content.innerHTML = '<div class="banner bad">データの読み込みに失敗しました。</div>';
      });
  }

  /* ============================================================
     競馬場別・期間別の予想精度と券種別仮想回収率(all_race_accuracy.json)
     2026-11-14追加: 今日/直近7日/直近30日/累計の切り替えに対応。
     ============================================================ */
  var ACCURACY_DATA = null;
  var ACCURACY_PERIOD = "last7";
  var PERIOD_LABELS = {today: "今日", last7: "直近7日", last30: "直近30日", all: "累計"};

  function renderAccuracyPeriodTable(container){
    if(!ACCURACY_DATA) return;
    var period = ACCURACY_DATA.by_period[ACCURACY_PERIOD] || {};
    var byTrack = period.by_track || {};
    var betTypes = ACCURACY_DATA.by_track_bet_types || {};
    var tracks = Object.keys(byTrack).sort();

    var toggle = document.createElement("div");
    toggle.className = "period-toggle";
    toggle.innerHTML = Object.keys(PERIOD_LABELS).map(function(p){
      return '<button data-period="' + p + '" class="' + (p === ACCURACY_PERIOD ? "active" : "") + '">' +
        esc(PERIOD_LABELS[p]) + "</button>";
    }).join("");
    container.appendChild(toggle);
    toggle.querySelectorAll("button").forEach(function(btn){
      btn.addEventListener("click", function(){
        ACCURACY_PERIOD = btn.getAttribute("data-period");
        var old = $("accuracyByTrackCard");
        if(old) old.remove();
        renderAccuracyPeriodTable(container);
      });
    });

    var card = document.createElement("div");
    card.id = "accuracyByTrackCard";
    card.className = "card table-wrap";
    var rows = tracks.map(function(t){
      var v = byTrack[t] || {};
      var bt = (betTypes[t] || {});
      var win = (bt.win_place || {})["単勝"] || {};
      var place = (bt.win_place || {})["複勝"] || {};
      var wide = bt.wide || {};
      var trio = (bt.trio_trifecta || {})["3連複"] || {};
      var trifecta = (bt.trio_trifecta || {})["3連単"] || {};
      var fmtR = function(x){ return (x && x.roi != null) ? x.roi + "%" : "—"; };
      return "<tr><td>" + esc(t) + "</td>" +
        '<td class="num">' + esc(v.n_confirmed != null ? v.n_confirmed : "—") + "</td>" +
        '<td class="num">' + esc(v.top1_win_rate != null ? v.top1_win_rate + "%" : "—") + "</td>" +
        '<td class="num">' + esc(v.top1_place_rate != null ? v.top1_place_rate + "%" : "—") + "</td>" +
        '<td class="num">' + esc(v.avg_top3_set_overlap != null ? v.avg_top3_set_overlap : "—") + "</td>" +
        '<td class="num">' + esc(v.trifecta_exact_rate != null ? v.trifecta_exact_rate + "%" : "—") + "</td></tr>" +
        '<tr><td colspan="6"><div class="bettype-mini">' +
          "<span>単勝<b>" + fmtR(win) + "</b></span>" +
          "<span>複勝<b>" + fmtR(place) + "</b></span>" +
          "<span>ワイド<b>" + fmtR(wide) + "</b></span>" +
          "<span>3連複<b>" + fmtR(trio) + "</b></span>" +
          "<span>3連単<b>" + fmtR(trifecta) + "</b></span>" +
        "</div></td></tr>";
    }).join("");
    card.innerHTML = '<table class="data"><tr><th>競馬場</th><th>確定数</th><th>1着的中</th><th>複勝的中</th>' +
      '<th>上位3頭一致(平均/3)</th><th>3連単完全一致</th></tr>' + (rows || '<tr><td colspan="6">未取得</td></tr>') + '</table>';
    container.appendChild(card);
  }

  function renderAccuracyByTrack(container){
    var title = document.createElement("div");
    title.className = "section-title";
    title.textContent = "全レース予想の精度・券種別仮想回収率(期間切り替え)";
    container.appendChild(title);

    var note = document.createElement("div");
    note.className = "banner info";
    note.textContent = "上の的中率は選択した期間の集計です。券種別仮想回収率(単勝〜3連単)は累計(全期間)の値を表示しています。買う・見送る判定とは無関係に全レースを対象とした仮想集計で、実際の馬券購入ではありません。";
    container.appendChild(note);

    (ACCURACY_DATA ? Promise.resolve(ACCURACY_DATA) :
      fetch("all_race_accuracy.json?t=" + Date.now(), {cache: "no-store"}).then(function(res){ return res.json(); })
    ).then(function(d){
      ACCURACY_DATA = d;
      renderAccuracyPeriodTable(container);
    }).catch(function(){
      var e = document.createElement("div");
      e.className = "banner bad";
      e.textContent = "券種別仮想回収率データの読み込みに失敗しました。";
      container.appendChild(e);
    });
  }

  function renderPnl(){
    var content = $("pnlContent");
    content.innerHTML = '<div class="loading">読み込み中…</div>';
    loadMobileSummary().then(function(d){
      content.innerHTML = "";
      var pt = d.paper_trading_summary || {};
      var settlement = d.strategy_settlement || {};
      var overall = settlement.overall_by_strategy || {};

      var realNote = document.createElement("div");
      realNote.className = "banner bad";
      realNote.textContent = "【実績】本番予想システムが実際のお金で購入・決済したことは一度もありません。以下はすべて仮想購入のシミュレーションです。";
      content.appendChild(realNote);

      var stratNote = document.createElement("div");
      stratNote.className = "banner info";
      stratNote.textContent = "戦略A-F仮想購入精算(" + (settlement.prediction_log_date_range || "期間不明") + "、リーク除外" +
        (settlement.n_leak_violations_excluded != null ? settlement.n_leak_violations_excluded : "-") + "件)。" +
        "全レースで◎を単勝/複勝、◎○・◎▲のワイド、◎○▲ワイドBOX、既存ベストフィルター該当時のみ複勝を購入した場合の精算結果。";
      content.appendChild(stratNote);

      var stratWrap = document.createElement("div");
      stratWrap.className = "card table-wrap";
      var stratRows = Object.keys(STRATEGY_LABELS).map(function(k){
        var full = Object.keys(overall).find(function(key){ return key.indexOf(k + "_") === 0; });
        var v = overall[full] || {};
        var roi = v.roi_pct;
        var roiText = (typeof roi === "number") ? roi + "%" : esc(roi || "—");
        return "<tr><td>" + esc(STRATEGY_LABELS[k]) + "</td>" +
          '<td class="num">' + esc(v.n_settled != null ? v.n_settled : "—") + "</td>" +
          '<td class="num">' + esc(v.hit_rate_pct != null ? v.hit_rate_pct + "%" : "—") + "</td>" +
          '<td class="num">' + roiText + "</td>" +
          '<td class="num">' + esc(v.max_drawdown_yen != null ? Math.round(v.max_drawdown_yen) + "円" : "—") + "</td></tr>";
      }).join("");
      stratWrap.innerHTML = '<table class="data"><tr><th>戦略</th><th>精算件数</th><th>的中率</th><th>回収率</th><th>最大DD</th></tr>' + stratRows + '</table>';
      content.appendChild(stratWrap);

      var legacyNote = document.createElement("div");
      legacyNote.className = "banner warn";
      legacyNote.textContent = "以下は別途運用している旧方式(Tier A・EVルール・新ルール・B候補)のPaper Trading記録です。実際のお金ではありません。" + (pt.updated_at || "");
      content.appendChild(legacyNote);

      var grid = document.createElement("div");
      grid.className = "summary-grid";
      grid.style.marginBottom = "12px";
      grid.innerHTML =
        '<div class="stat-card"><div class="label">検証件数</div><div class="value num">' + esc(pt.total_n || "—") + '</div></div>' +
        '<div class="stat-card"><div class="label">的中率</div><div class="value num">' + esc(pt.total_hit_rate || "—") + '</div></div>' +
        '<div class="stat-card"><div class="label">仮想回収率</div><div class="value num accent">' + esc(pt.total_roi || "—") + '</div></div>' +
        '<div class="stat-card"><div class="label">仮想収支</div><div class="value num">' + esc(pt.balance || "—") + '</div></div>';
      content.appendChild(grid);

      var wrap = document.createElement("div");
      wrap.className = "card table-wrap";
      var rows = (pt.condition_rows || []).map(function(row){
        return "<tr>" + row.map(function(c,i){ return (i===0 ? "<td>" : '<td class="num">') + esc(c) + "</td>"; }).join("") + "</tr>";
      }).join("");
      wrap.innerHTML = '<table class="data"><tr><th>条件</th><th>件数</th><th>的中率</th><th>回収率</th><th>最大連敗</th></tr>' + (rows || '<tr><td colspan="5">未取得</td></tr>') + '</table>';
      content.appendChild(wrap);

      var link = document.createElement("div");
      link.className = "banner neutral";
      link.innerHTML = '条件ごとの詳細・訂正履歴は<a href="track-record.html">検証実績ページ →</a>をご覧ください。';
      content.appendChild(link);

      $("statRoi").textContent = (overall["F_既存ベストフィルター"] || {}).roi_pct || pt.total_roi || "—";
    }).catch(function(){
      content.innerHTML = '<div class="banner bad">データの読み込みに失敗しました。</div>';
    });
  }

  /* ============================================================
     研究結果(要約 + リンク)
     ============================================================ */
  function renderResearch(){
    var content = $("researchContent");
    content.innerHTML = '<div class="loading">読み込み中…</div>';
    fetch("umalab_research_dashboard_data.json?t=" + Date.now(), {cache: "no-store"})
      .then(function(res){ return res.json(); })
      .then(function(d){
        content.innerHTML = "";
        var intro = document.createElement("div");
        intro.className = "banner info";
        intro.textContent = "研究用バックテストの要約です。実際の購入成績ではありません。最終更新: " + (d.updated_at || "不明");
        content.appendChild(intro);

        [
          ["第10段階", d.stage10_overall_conclusion],
          ["第9段階", d.stage9_overall_conclusion],
          ["第8段階", d.stage8_overall_conclusion],
        ].forEach(function(pair){
          if(!pair[1]) return;
          var c = document.createElement("div");
          c.className = "card";
          c.innerHTML = '<div class="section-title">' + pair[0] + '</div><div style="font-size:13px;color:var(--text-dim);">' + esc(pair[1]) + '</div>';
          content.appendChild(c);
        });

        var link = document.createElement("div");
        link.className = "banner neutral";
        link.innerHTML = '競馬場別・モデル別の全データは<a href="umalab-research-dashboard.html">研究ダッシュボード全体 →</a>でご覧いただけます。';
        content.appendChild(link);
      })
      .catch(function(){
        content.innerHTML = '<div class="banner bad">データの読み込みに失敗しました。</div>';
      });
  }

  /* ============================================================
     タブ切り替え
     ============================================================ */
  var LOADED = {};
  var LOADERS = {
    today: loadToday, tomorrow: loadTomorrow, results: renderResults,
    tracks: renderTracks, pnl: renderPnl, research: renderResearch,
  };
  document.querySelectorAll(".nav-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      var view = btn.getAttribute("data-view");
      document.querySelectorAll(".nav-btn").forEach(function(b){ b.classList.toggle("active", b === btn); });
      document.querySelectorAll(".view").forEach(function(v){ v.classList.toggle("active", v.id === "view-" + view); });
      if(!LOADED[view]){ LOADED[view] = true; LOADERS[view](); }
      window.scrollTo(0, 0);
    });
  });

  loadToday();
  LOADED.today = true;
  loadMobileSummary().then(function(d){
    if(d.paper_trading_summary && d.paper_trading_summary.total_roi){
      $("statRoi").textContent = d.paper_trading_summary.total_roi;
    }
  }).catch(function(){});
})();
</script>
</body>
</html>
