<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMALAB研究ダッシュボード</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:#f6f4ee;color:#1d2318;font-family:-apple-system,"Hiragino Sans",sans-serif;line-height:1.6;}
@media (prefers-color-scheme: dark){body{background:#12150f;color:#eae7dc;}}
.wrap{max-width:640px;margin:0 auto;padding:20px 14px 64px;}
h1{font-size:18px;margin:0 0 6px;}
h2{font-size:14px;margin:0 0 10px;color:#4a5340;}
@media (prefers-color-scheme: dark){h2{color:#9aa68a;}}
.lede{font-size:12.5px;color:#5c6455;margin:0 0 12px;}
@media (prefers-color-scheme: dark){.lede{color:#a4ac97;}}
.alert{background:#f6e3e0;border:1px solid #af3a35;color:#af3a35;border-radius:10px;padding:12px 14px;font-size:12.5px;font-weight:700;margin-bottom:16px;}
@media (prefers-color-scheme: dark){.alert{background:#382019;border-color:#e2867d;color:#e2867d;}}
.panel{background:#fff;border:1px solid #dcd5c5;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
@media (prefers-color-scheme: dark){.panel{background:#1a1f16;border-color:#333c2b;}}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{border-bottom:1px solid #e3ddc9;padding:5px 6px;text-align:right;white-space:nowrap;}
@media (prefers-color-scheme: dark){th,td{border-color:#2a3122;}}
th:first-child,td:first-child{text-align:left;}
th{color:#5c6455;font-weight:600;}
@media (prefers-color-scheme: dark){th{color:#a4ac97;}}
.best{font-weight:800;color:#2a6b3a;}
@media (prefers-color-scheme: dark){.best{color:#7fd89a;}}
.scroll{overflow-x:auto;}
.note{font-size:11.5px;color:#8a9180;margin-top:6px;}
@media (prefers-color-scheme: dark){.note{color:#6f7a63;}}
.tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:#eeebe1;color:#5c6455;margin-right:4px;}
@media (prefers-color-scheme: dark){.tag{background:#20261b;color:#9aa68a;}}
.refresh{display:block;width:100%;min-height:44px;padding:10px;background:#3a6b3a;color:#fff;border:none;border-radius:8px;margin-top:8px;font-size:14px;}
select{width:100%;min-height:40px;padding:8px;border-radius:8px;border:1px solid #dcd5c5;background:#fff;color:#1d2318;font-size:14px;margin-bottom:8px;}
@media (prefers-color-scheme: dark){select{background:#1a1f16;border-color:#333c2b;color:#eae7dc;}}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;margin-bottom:8px;}
.pill-ok{background:#dcebdd;color:#2a6b3a;}
.pill-warn{background:#f6e3e0;color:#af3a35;}
@media (prefers-color-scheme: dark){.pill-ok{background:#1e3324;color:#7fd89a;}.pill-warn{background:#382019;color:#e2867d;}}
</style></head><body>
<div class="wrap">
<h1>UMALAB研究ダッシュボード</h1>
<p class="lede"><a href="./today-picks.html">本日の買い目(本番)へ →</a>　<a href="./track-record.html">実績ページへ →</a></p>

<div class="alert">
【研究・検証専用】ここに表示される新戦略候補は検証中であり、実運用の推奨ではありません。
本番の買い目は現行ワイド1点のみです。実際の馬券購入・自動投票は行っていません。
利益を保証する結果ではありません。
</div>

<div id="content">読み込み中...</div>
<button class="refresh" onclick="load(true)">更新</button>
</div>

<script>
function fmtPct(v){ return v === null || v === undefined ? '-' : v + '%'; }
function periodTag(label){ return `<span class="tag">${label}</span>`; }

function constructionRows(rows){
  return rows.map(r => {
    const cls = r.is_best ? ' class="best"' : '';
    const d = r.discovery, c = r.confirmation, h = r.holdout;
    return `<tr${cls}><td>${r.name}${r.is_best ? ' ★' : ''}</td>
      <td>${fmtPct(d.roi)}</td><td>${fmtPct(c.roi)}</td><td>${fmtPct(h.roi)}</td>
      <td>${r.replicated === true ? '再現' : r.replicated === false ? '未再現' : '判定不可'}</td></tr>`;
  }).join('');
}

function segmentRows(rows){
  return rows.map(r =>
    `<tr><td>${r.dimension}=${r.condition}</td><td>${r.n}</td><td>${fmtPct(r.hit_rate)}</td><td>${fmtPct(r.roi)}</td></tr>`
  ).join('');
}

function modelRows(rows){
  return rows.map(r =>
    `<tr><td>${r.name}</td><td>${r.test_logloss}</td><td>${r.vs_model_e_logloss}</td>
      <td>${r.adopted ? '採用' : '不採用'}</td></tr>`
  ).join('');
}

function stakingRows(staking){
  if (!staking) return '';
  return Object.entries(staking).filter(([k,v]) => v && 'final_bankroll' in v).map(([label, s]) =>
    `<tr><td>${label}</td><td>${s.final_bankroll}</td><td>${s.max_drawdown_pct}%</td>
      <td>${s.ruined ? 'はい' : 'いいえ'}</td></tr>`
  ).join('');
}

let DASHBOARD_DATA = null;

let CURRENT_PERIOD = 'all_periods';

function setPeriod(p){ CURRENT_PERIOD = p; renderTrack(); }

function renderTrack(){
  const sel = document.getElementById('trackSelect');
  const t = DASHBOARD_DATA.track_profile.find(x => x.track === sel.value);
  if (!t) { document.getElementById('trackDetail').innerHTML = ''; return; }
  const pillClass = t.classification && t.classification.startsWith('有望') ? 'pill-ok' : 'pill-warn';
  const full = (DASHBOARD_DATA.all_track_full_report || {})[sel.value];
  const periodLabels = {all_periods:'全期間', discovery:'発見期間', confirmation:'検証期間', holdout:'ホールドアウト'};
  const periodButtons = Object.entries(periodLabels).map(([key,label]) =>
    `<button class="refresh" style="background:${key===CURRENT_PERIOD?'#2a6':'#555'};display:inline-block;width:auto;min-height:32px;padding:6px 10px;margin:2px;font-size:12px;" onclick="setPeriod('${key}')">${label}</button>`
  ).join('');

  let betRows = '';
  let countsHtml = '';
  if (full) {
    betRows = Object.entries(full.bet_type_roi || {}).map(([bt, periods]) => {
      const s = periods[CURRENT_PERIOD] || {};
      if (!s.n) return `<tr><td>${bt}</td><td colspan="4">データなし</td></tr>`;
      const pnl = Math.round((s.payout_total||0) - (s.bet_total||0));
      return `<tr><td>${bt}</td><td>${s.n}</td><td>${fmtPct(s.hit_rate)}</td><td>${fmtPct(s.roi)}</td><td>${pnl}円</td></tr>`;
    }).join('');
    countsHtml = `
      <tr><td>解析レース総数/学習/検証/未使用期間</td>
        <td>${full.total_races_full_history}/${full.train_races}/${full.val_races}/${full.test_races}</td></tr>
      <tr><td>直近予測レース数(買い目/見送り)</td>
        <td>${full.predicted_races_recent}(${full.buy_races_recent}/${full.skip_races_recent})</td></tr>`;
  }

  document.getElementById('trackDetail').innerHTML = `
    <span class="pill ${pillClass}">${t.classification ?? '-'}</span>
    <div class="scroll"><table>
      <tr><th>指標</th><th>値</th></tr>
      <tr><td>本命勝率(test, n=${t.n_races_test})</td><td>${fmtPct(t.top1_win_rate)}</td></tr>
      <tr><td>複勝圏再現率</td><td>${fmtPct(t.top3_recall)}</td></tr>
      <tr><td>logloss</td><td>${t.logloss ?? '-'}</td></tr>
      <tr><td>校正誤差</td><td>${t.calibration_error ?? '-'}pt</td></tr>
      ${countsHtml}
    </table></div>
    <div>${periodButtons}</div>
    <div class="scroll"><table>
      <tr><th>券種</th><th>件数</th><th>的中率</th><th>ROI</th><th>純利益</th></tr>
      ${betRows}
    </table></div>
    <p class="note">ホールドアウトは複数ステージで既に参照済みのため完全未使用ではありません。</p>`;
}

function renderRankings(){
  if (!DASHBOARD_DATA.track_rankings) return;
  const html = Object.entries(DASHBOARD_DATA.track_rankings).map(([name, rows]) => {
    const top5 = rows.slice(0, 5).map(r =>
      `<tr><td>${r.track}</td><td>${r.value}</td><td>${r.n}${r.insufficient_sample ? '(不足)' : ''}</td></tr>`
    ).join('');
    return `<h2 style="font-size:13px;margin-top:14px;">${name}</h2>
      <div class="scroll"><table><tr><th>競馬場</th><th>値</th><th>件数</th></tr>${top5}</table></div>`;
  }).join('');
  document.getElementById('trackRankings').innerHTML = html;
}

async function load(force){
  const url = 'umalab_research_dashboard_data.json' + (force ? ('?t='+Date.now()) : '');
  const r = await fetch(url, {cache: force ? 'no-store' : 'default'});
  const d = await r.json();
  DASHBOARD_DATA = d;
  const m = d.current_model_vs_candidates;

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <h2>最終更新: ${d.updated_at}</h2>
      <p class="note">購入時点オッズのデータ期間: ${d.data_coverage.purchase_time_odds_period} /
        検証対象leg数: ${d.data_coverage.n_total_legs_baseline ?? '-'}</p>
      <p>${periodTag('発見期間')}${periodTag('検証期間')}${periodTag('完全未使用ホールドアウト')}の3段階で評価</p>
    </div>

    <div class="panel">
      <h2>券種別成績(現行モデルの予測を使用)</h2>
      <p class="note">最良候補: <strong>${m.best_candidate ?? '-'}</strong> — ${m.best_candidate_reason ?? ''}</p>
      <div class="scroll"><table>
        <tr><th>構成</th><th>発見ROI</th><th>検証ROI</th><th>ホールドアウトROI</th><th>再現性</th></tr>
        ${constructionRows(m.constructions)}
      </table></div>
      <p class="note">★=最良候補(多くの場合、現行ベースラインのまま=改善未確認)。ROIは100%が損益ゼロ。</p>
    </div>

    <div class="panel">
      <h2>モデル比較(予測アルゴリズムの違い)</h2>
      <div class="scroll"><table>
        <tr><th>モデル</th><th>test logloss</th><th>Model E logloss</th><th>判定</th></tr>
        ${modelRows(d.model_algorithm_comparison)}
      </table></div>
      <p class="note">loglossは小さいほど良い。確率校正: raw Brier=${d.probability_calibration?.brier_score_raw ?? '-'} /
        isotonic校正後=${d.probability_calibration?.brier_score_isotonic_calibrated ?? '-'}</p>
    </div>

    <div class="panel">
      <h2>競馬場別プロファイル(第4段階)</h2>
      <select id="trackSelect" onchange="renderTrack()"></select>
      <div id="trackDetail"></div>
      <p class="note">予測精度(的中率・logloss・校正誤差)はtest期間(未知データ、各場数百件)。
        回収率は購入時点オッズが存在する32日分のみ(各場数十〜百数十件、サンプル不足の場合あり)。</p>
    </div>

    <div class="panel">
      <h2>競馬場別ランキング(上位5)</h2>
      <div id="trackRankings"></div>
    </div>

    <div class="panel">
      <h2>コース構造の知見(NAR公式ガイドブック)</h2>
      <p class="note">${d.course_geometry_findings?.nagoya_relocation ?? ''}</p>
      <p class="note">${d.course_geometry_findings?.himeji_data_gap ?? ''}</p>
      <p class="note">${d.course_geometry_findings?.other_notes ?? ''}</p>
    </div>

    <div class="panel">
      <h2>外部情報源調査(第3段階)</h2>
      <div class="scroll"><table>
        <tr><th>情報源</th><th>所見</th></tr>
        ${Object.entries(d.external_source_survey || {}).map(([k,v]) =>
          `<tr><td>${k}</td><td style="text-align:left;white-space:normal;">${v}</td></tr>`).join('')}
      </table></div>
      <p class="note">新聞・AI予想サイト(競馬ブック・netkeiba・SPAIA競馬)は利用規約でスクレイピングを
        明示的に禁止しており、地方競馬の完全な過去予想印アーカイブも確認できなかったため、
        新聞対UMALABの実データ比較は未実施(規約上の制約。捏造はしていません)。</p>
    </div>

    <div class="panel">
      <h2>資金配分方式の比較(最良候補に適用)</h2>
      <div class="scroll"><table>
        <tr><th>方式</th><th>最終資金</th><th>最大DD</th><th>破産</th></tr>
        ${stakingRows(d.staking_comparison)}
      </table></div>
    </div>

    <div class="panel">
      <h2>弱点セグメントTOP10(ROI最低)</h2>
      <div class="scroll"><table>
        <tr><th>条件</th><th>件数</th><th>的中率</th><th>ROI</th></tr>
        ${segmentRows(d.weakest_segments_top10)}
      </table></div>
    </div>

    <div class="panel">
      <h2>強い条件TOP10(ROI最高・未再現含む参考値)</h2>
      <div class="scroll"><table>
        <tr><th>条件</th><th>件数</th><th>的中率</th><th>ROI</th></tr>
        ${segmentRows(d.strongest_segments_top10)}
      </table></div>
      <p class="note">ここでの「強い」は全期間プールの記述統計。期間分割で再現しない場合は採用していません。</p>
    </div>

    <div class="panel">
      <h2>注記</h2>
      <p class="note">${d.notes.join(' / ')}</p>
    </div>
  `;

  const sel = document.getElementById('trackSelect');
  sel.innerHTML = (d.track_profile || []).map(t => `<option value="${t.track}">${t.track}</option>`).join('');
  if (d.track_profile && d.track_profile.length) renderTrack();
  renderRankings();
}
load(false);
</script>
</body></html>
